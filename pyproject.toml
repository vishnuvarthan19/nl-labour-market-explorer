[tool.poetry]
name = "nl-labour-market-explorer"
version = "0.1.0"
description = "An open-source data product taking you from raw Dutch labour market data to a finished report."
authors = ["Your Name <your.email@example.com>"]
packages = [
    { include = "ingestion" },
    { include = "tests" }
]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.31.0"
pandas = "^2.0.0"
pyarrow = "^24.0.0"
psycopg = { version = "^3.1.0", extras = ["binary"] }

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
dbt-core = "^1.5.0"
dbt-postgres = "^1.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
